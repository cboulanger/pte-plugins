name: Pages

# Publishes https://mpilhlt.github.io/pte-plugins/ on every push to main (scripts/build_site.py):
# - index.html: overview of all plugins with their metadata and links to their READMEs
# - pte-plugins.json: the plugin index
# - <plugin>/: the documentation that plugins serve to the public (the plugin's docs/ directory),
#   e.g. archival-edition: schema and annotation guidelines (their URLs are recorded in TEI documents)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the index
        run: python3 scripts/build_index.py --check

      - name: Assemble site
        run: python3 scripts/build_site.py _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
