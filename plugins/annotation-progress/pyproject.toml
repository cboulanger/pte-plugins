[project]
name = "pte-plugin-annotation-progress"
dynamic = ["version"]
description = "View annotation progress in the current collection"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
annotation-progress = "pte_plugin_annotation_progress"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_annotation_progress/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_annotation_progress"]
exclude = ["src/pte_plugin_annotation_progress/tests"]
