[project]
name = "pte-plugin-iaa-analyzer"
dynamic = ["version"]
description = "Compute agreement between annotation versions by comparing element positions in <text>"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
iaa-analyzer = "pte_plugin_iaa_analyzer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_iaa_analyzer/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_iaa_analyzer"]
exclude = ["src/pte_plugin_iaa_analyzer/tests"]
