[project]
name = "pte-plugin-google-llm"
dynamic = ["version"]
description = "Registers Google's Gemini API as an LLM inference provider"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = [
    "google-genai>=1.56.0",
    "httpx>=0.28.0",
]

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
google-llm = "pte_plugin_google_llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_google_llm/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_google_llm"]
exclude = ["src/pte_plugin_google_llm/tests"]
