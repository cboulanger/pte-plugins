[project]
name = "pte-plugin-webdav-sync"
dynamic = ["version"]
description = "Synchronize files with a WebDAV server"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = [
    "webdav4[fsspec]>=0.10.0",
]

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
webdav-sync = "pte_plugin_webdav_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_webdav_sync/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_webdav_sync"]
exclude = ["src/pte_plugin_webdav_sync/tests"]
