[project]
name = "pte-plugin-inference-endpoints"
dynamic = ["version"]
description = "Registers OpenAI-compatible inference endpoints (e.g. Ollama) as LLM providers"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
inference-endpoints = "pte_plugin_inference_endpoints"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_inference_endpoints/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_inference_endpoints"]
exclude = ["src/pte_plugin_inference_endpoints/tests"]
