[project]
name = "pte-plugin-metadata-extraction"
dynamic = ["version"]
description = "Extract bibliographic metadata from PDFs, enrich TEI headers and backfill missing metadata in collections"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = [
    "pte-plugin-grobid",
]

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
metadata-extraction = "pte_plugin_metadata_extraction"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_metadata_extraction/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_metadata_extraction"]
exclude = ["src/pte_plugin_metadata_extraction/tests"]

[tool.uv.sources]
pte-plugin-grobid = { workspace = true }
