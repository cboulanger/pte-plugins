[project]
name = "pte-plugin-anthropic-llm"
dynamic = ["version"]
description = "Registers Anthropic's Claude API as an LLM inference provider"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
anthropic-llm = "pte_plugin_anthropic_llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_anthropic_llm/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_anthropic_llm"]
exclude = ["src/pte_plugin_anthropic_llm/tests"]
