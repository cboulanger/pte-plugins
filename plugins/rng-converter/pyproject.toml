[project]
name = "pte-plugin-rng-converter"
dynamic = ["version"]
description = "Generate RelaxNG schema from TEI document structure"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
rng-converter = "pte_plugin_rng_converter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_rng_converter/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_rng_converter"]
exclude = ["src/pte_plugin_rng_converter/tests"]
