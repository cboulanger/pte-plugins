[project]
name = "pte-plugin-local-sync"
dynamic = ["version"]
description = "Synchronize collection documents with local filesystem"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/cboulanger/pte-plugins"

[project.entry-points."pte.plugins"]
local-sync = "pte_plugin_local_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_local_sync/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_local_sync"]
exclude = ["src/pte_plugin_local_sync/tests"]
