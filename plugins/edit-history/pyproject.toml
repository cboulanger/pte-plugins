[project]
name = "pte-plugin-edit-history"
dynamic = ["version"]
description = "View recent activity in the current collection"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
edit-history = "pte_plugin_edit_history"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_edit_history/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_edit_history"]
exclude = ["src/pte_plugin_edit_history/tests"]
