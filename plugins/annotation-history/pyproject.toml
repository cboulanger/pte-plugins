[project]
name = "pte-plugin-annotation-history"
dynamic = ["version"]
description = "Shows detailed annotation history for PDF documents"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = []

[project.urls]
Repository = "https://github.com/mpilhlt/pte-plugins"

[project.entry-points."pte.plugins"]
annotation-history = "pte_plugin_annotation_history"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pte_plugin_annotation_history/pte-plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/pte_plugin_annotation_history"]
exclude = ["src/pte_plugin_annotation_history/tests"]
